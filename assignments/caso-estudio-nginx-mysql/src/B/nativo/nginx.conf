user www-data;
worker_processes 2;
worker_rlimit_nofile 16384;
pid /run/nginx.pid;

events {
    worker_connections 7202;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    keepalive_timeout 65;

    server {
        listen 80 default_server;
        root /var/www/html;
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
